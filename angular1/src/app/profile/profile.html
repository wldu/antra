<p>Welcome, {{ name.value }} !</p>
Name: <input [formControl]="name">
Email: <input [formControl]="email" >
Date of birth: <input [formControl]="dateOfBirth">
<button (click)="save()">Save</button>
<button (click)="reset()" [disabled]="!name.value && !email.value && !dateOfBirth.value">Clear</button>
